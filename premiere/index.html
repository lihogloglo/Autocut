<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 12px; color: var(--uxp-host-text-color); font-size: 12px; }
    #status { margin: 6px 0 12px; color: var(--uxp-host-text-color-secondary); }
    #status.err { color: #f85149; }
    #status.ok { color: #3fb950; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    #log { font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; overflow-y: auto;
           max-height: 260px; color: var(--uxp-host-text-color-secondary); }
    #log .err { color: #f85149; }
  </style>
</head>
<body>
  <sp-heading size="XS">Autocut</sp-heading>
  <sp-picker id="kind" label="Quoi" size="s">
    <sp-menu slot="options">
      <sp-menu-item value="sources" selected>Illustrations</sp-menu-item>
      <sp-menu-item value="storyboard">Storyboard</sp-menu-item>
    </sp-menu>
  </sp-picker>
  <div id="status">…</div>
  <div class="row">
    <sp-button id="place" variant="cta">Placer les illustrations</sp-button>
    <sp-button id="remove" variant="secondary">Retirer</sp-button>
  </div>
  <div id="log"></div>
  <script src="index.js"></script>
</body>
</html>
