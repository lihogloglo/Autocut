<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Autocut</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#3a4fd6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- a strip of film, cut in two -->
  <g fill="#ffffff" fill-opacity="0.22">
    <path d="M28 150 h92 l-14 36 h-78 z"/>
    <path d="M150 150 h78 v36 h-92 z"/>
  </g>
  <g fill="#3a4fd6" fill-opacity="0.9">
    <rect x="38" y="158" width="12" height="8" rx="2"/><rect x="62" y="158" width="12" height="8" rx="2"/>
    <rect x="86" y="158" width="12" height="8" rx="2"/><rect x="164" y="158" width="12" height="8" rx="2"/>
    <rect x="188" y="158" width="12" height="8" rx="2"/><rect x="212" y="158" width="12" height="8" rx="2"/>
    <rect x="34" y="172" width="12" height="8" rx="2"/><rect x="58" y="172" width="12" height="8" rx="2"/>
    <rect x="82" y="172" width="12" height="8" rx="2"/><rect x="160" y="172" width="12" height="8" rx="2"/>
    <rect x="184" y="172" width="12" height="8" rx="2"/><rect x="208" y="172" width="12" height="8" rx="2"/>
  </g>
  <!-- the axe that made the cut -->
  <g transform="rotate(32 128 118)">
    <rect x="120" y="44" width="16" height="170" rx="8" fill="#f4e3c4"/>
    <rect x="120" y="190" width="16" height="24" rx="8" fill="#e2c897"/>
    <path d="M110 54 H148 C166 46 180 36 190 26 C214 56 214 120 190 150 C180 140 166 130 148 122 V94 H110 Z" fill="#ffffff"/>
    <path d="M190 26 C214 56 214 120 190 150 C201 120 201 56 190 26 Z" fill="#ffb84d"/>
    <rect x="110" y="54" width="38" height="40" rx="7" fill="#2b3550"/>
  </g>
</svg>
