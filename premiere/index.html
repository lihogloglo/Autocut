<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 10px 12px; color: var(--uxp-host-text-color); font-size: 12px; }
    .head { display: flex; align-items: center; gap: 8px; }
    .head b { font-size: 13px; }
    #dot { width: 8px; height: 8px; border-radius: 4px; background: #8a8a8a; flex: none; }
    #dot.ok { background: #3fb950; }
    #dot.wait { background: #d29922; }
    #dot.bad { background: #8a8a8a; }
    #conn { color: var(--uxp-host-text-color-secondary); }
    #start { display: none; margin-top: 8px; }
    #status { margin-top: 6px; color: var(--uxp-host-text-color-secondary); }
    #status.err { color: #f85149; }
    #status.note { color: #e6c37a; }
  </style>
</head>
<body>
  <!-- A connector: everything is done from the FauxRaccord window. Nothing to click here, except to start
       FauxRaccord when it is closed. -->
  <div class="head"><div id="dot"></div><b id="name">FauxRaccord</b><span id="conn">…</span></div>
  <sp-button id="start" size="s" variant="cta">Démarrer</sp-button>
  <div id="status"></div>
  <script src="index.js"></script>
</body>
</html>
