[project]
name = "autocut"
version = "0.1.0"
description = "Derush long talking-head recordings against their script, for Premiere Pro"
readme = "README.md"
authors = [
    { name = "lihogloglo", email = "7213266+lihogloglo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastembed>=0.9.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "num2words>=0.5.14",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12==12.4.5.8 ; sys_platform == 'win32'",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "pywebview>=6.2.1",
    "rapidfuzz>=3.14.6",
    "static-ffmpeg>=3.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
autocut = "autocut:main"
autocut-sources = "autocut.sourcing:main"
autocut-storyboard = "autocut.storyboard:main"

[project.gui-scripts]
autocut-gui = "autocut.gui:main"
autocut-sources-gui = "autocut.gui:main_sources"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
