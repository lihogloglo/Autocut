<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planche sonore</title>
<link rel="icon" href="data:,">
<style>
:root { --bg:#f6f7f9; --surface:#fff; --surface-2:#f2f4f7; --border:#e1e4ea; --text:#1b1d22; --muted:#6a7080;
  --accent:#4a6cf7; --accent-soft:#e8edff; --ok:#1f9d63; --danger:#d6453d; --star:#e0a100; --wave:#b9bfcc;
  --k-whoosh:#4a6cf7; --k-click:#1f9d63; --k-pop:#e8833a; --k-typing:#9b59b6; --k-hit:#d6453d; --k-riser:#0e9fb3; --k-other:#7d8597;
  --k-amb:#2a9d8f; --k-music:#c2477d; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --surface:#212328; --surface-2:#272a30; --border:#2f323a;
  --text:#e7e8ec; --muted:#9399a6; --accent:#6d8bff; --accent-soft:#252c48; --star:#ffc53d; --wave:#4d5260;
  --k-whoosh:#6d8bff; --k-click:#3ccf8e; --k-pop:#ff9f5a; --k-typing:#c084fc; --k-hit:#ff6b63; --k-riser:#38c6da; --k-other:#9aa1b2;
  --k-amb:#4fd1c5; --k-music:#f472b6; color-scheme:dark; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:13.5px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; user-select:none; }
button, input { font:inherit; color:inherit; }
.bar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; }
.bar h1 { font-size:15px; font-weight:650; margin:0 6px 0 0; white-space:nowrap; }
.tabs { display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
.tabs button { border:0; background:transparent; padding:7px 14px; cursor:pointer; display:flex; gap:7px; align-items:center; }
.tabs button i { width:9px; height:9px; border-radius:3px; background:var(--c); }
.tabs button.on { background:var(--accent); color:#fff; }
.tabs button small { opacity:.7; }
.search { display:flex; gap:6px; flex:1; min-width:220px; max-width:520px; }
.search input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
.btn { border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap; }
.btn:hover { border-color:var(--muted); }
.btn:disabled { opacity:.5; cursor:default; }
.btn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.switch { display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--muted); white-space:nowrap; }
.switch input { accent-color:var(--accent); }
main { overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
main > * { flex-shrink:0; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
.tile { --c:var(--k-other); position:relative; background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:12px 12px 10px; display:flex; flex-direction:column; gap:6px; cursor:grab; overflow:hidden; }
.tile::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--c); }
.tile:hover { border-color:var(--c); }
.tile.sel { border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.tile.empty { opacity:.5; cursor:default; }
.tile.add { border-style:dashed; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; min-height:120px; }
.tile.add::before { display:none; }
.tile.add b { font-size:28px; font-weight:400; line-height:1; }
.tile.add:hover { color:var(--accent); border-color:var(--accent); }
.tile-edit { display:grid; grid-template-columns:minmax(120px, 220px) 1fr auto auto; gap:8px; align-items:end; }
.tile-edit label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
.tile-edit input { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; user-select:text; }
.tile-edit .name-in { font-weight:650; font-size:15px; }
.btn.danger:hover { border-color:var(--danger); color:var(--danger); }
.results-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
@media (max-width: 820px) { .tile-edit { grid-template-columns:1fr 1fr; } }
.tile .top { display:flex; align-items:center; gap:8px; }
.tile .top b { font-size:15px; flex:1; }
.tile .count { color:var(--muted); font-size:12px; }
.tile .take { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:17px; }
.tile canvas { width:100%; height:38px; display:block; }
.tile .state { font-size:11.5px; color:var(--accent); min-height:16px; }
.tile .state.err, .row .state.err { color:var(--danger); }
.icon { border:0; background:transparent; cursor:pointer; padding:3px 7px; border-radius:6px; font-size:14px; color:var(--muted); line-height:1; }
.icon:hover { background:var(--surface-2); color:var(--text); }
.icon.star.on { color:var(--star); }
.dragging { opacity:.55; cursor:grabbing; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:4px 0 -6px; font-weight:600; display:flex; gap:10px; align-items:baseline; }
h2 small { text-transform:none; letter-spacing:0; font-weight:400; }
.list { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.row { --c:var(--k-other); display:grid; grid-template-columns:28px 30px minmax(160px, 1.3fr) minmax(120px, 1fr) 54px 56px; gap:8px; align-items:center;
  padding:6px 10px; border-top:1px solid var(--border); cursor:grab; }
.row:first-child { border-top:0; }
.row:hover { background:var(--surface-2); }
.row.cur { background:var(--accent-soft); }
.row .name { min-width:0; display:flex; flex-direction:column; }
.row .name b { font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .name small { color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row canvas { width:100%; height:30px; display:block; cursor:pointer; }
.row .dur { color:var(--muted); font:12px Consolas,monospace; text-align:right; }
.row .state { font-size:11.5px; color:var(--accent); }
.badge { font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:1px 5px; border-radius:4px; background:var(--surface-2); color:var(--muted); margin-left:4px; vertical-align:1px; }
.badge.ep { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
.empty-note { color:var(--muted); padding:28px; text-align:center; line-height:1.6; }
.lvl { font:12px Consolas,monospace; color:var(--muted); text-align:right; white-space:nowrap; }
.tile .lvl { margin-left:auto; }
.tile .take { display:flex; gap:6px; }
.tile .take span:first-child { overflow:hidden; text-overflow:ellipsis; }
.icon.sim { font-size:13px; padding:1px 5px; margin-left:2px; }
.views { display:flex; gap:0; border:1px solid var(--border); border-radius:9px; overflow:hidden; align-self:flex-start; }
.views button { border:0; background:var(--surface); padding:6px 14px; cursor:pointer; }
.views button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.ask { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.ask label { display:flex; flex-direction:column; gap:6px; font-weight:600; }
.ask textarea, .cue input { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 10px; resize:vertical; user-select:text; }
.ask .line { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.ask small, .muted { color:var(--muted); font-weight:400; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.cue { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.cue-top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.cue-top b { font-size:15px; }
.cue-top .tc { color:var(--muted); font:12px Consolas,monospace; }
.cue .feel { margin:0; color:var(--text); }
.cue .text { margin:0; color:var(--muted); font-size:12px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cue .tools { display:grid; grid-template-columns:1fr auto 1fr auto; gap:6px; }
.cue .list { border-radius:9px; }
@media (max-width: 820px) { .cue .tools { grid-template-columns:1fr auto; } }
.more { padding:8px; text-align:center; }
footer { display:flex; align-items:center; gap:14px; padding:8px 16px; border-top:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12px; }
footer .now { color:var(--text); font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45vw; }
footer .grow { flex:1; }
.toast { position:fixed; right:18px; bottom:48px; background:var(--text); color:var(--bg); padding:9px 14px; border-radius:8px; font-size:13px; z-index:9; max-width:440px; }
</style>
<script src="i18n.js"></script>
</head>
<body>
<header class="bar">
  <h1>Planche sonore</h1>
  <div class="tabs" id="tabs">
    <button data-tab="sfx" style="--c:var(--k-whoosh)"><i></i><span>Bruitages</span> <small data-n="sfx" data-noi18n></small></button>
    <button data-tab="amb" style="--c:var(--k-amb)"><i></i><span>Ambiances</span> <small data-n="amb" data-noi18n></small></button>
    <button data-tab="music" style="--c:var(--k-music)"><i></i><span>Musiques</span> <small data-n="music" data-noi18n></small></button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Filtrer… (Entrée : chercher sur Epidemic)" spellcheck="false" autocomplete="off">
    <button class="btn" id="epi" hidden>Epidemic</button>
  </div>
  <label class="switch" id="rnd-wrap" title="Une tuile donne une prise différente à chaque glisser, parmi les étoilées (toutes s'il n'y en a pas)">
    <input type="checkbox" id="rnd"><span>Prise au hasard</span></label>
  <button class="btn" id="stars-only" title="Seulement les sons étoilés">★</button>
</header>

<main id="main"></main>

<footer>
  <button class="icon" id="stop" title="Arrêter (Espace)">■</button>
  <span class="now" id="now" data-noi18n></span>
  <span class="grow"></span>
  <span id="hint">Glissez une tuile ou une ligne dans la timeline de Premiere. Espace : écouter.</span>
</footer>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const API = () => window.pywebview && window.pywebview.api;
const tiles = () => settings.tiles || [];
const tileOf = (id) => tiles().find((x) => x.id === id);
const hueOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const tileColor = (x) => (x.kind ? `var(--k-${x.kind})` : `hsl(${hueOf(x.id)} 55% 50%)`);
const SOURCE = { folder: "", earshot: "banque", epidemic: "Epidemic" };
const PAGE = 120;

let items = [], byId = {}, settings = { stars: [], random: true, tab: "sfx", tiles: [] }, next = {}, members = {}, epidemicOn = false;
let family = "whoosh", found = { sfx: [], amb: [], music: [] }, foundLabel = {}, starsOnly = false, shown = PAGE, sig = "";
let view = { amb: "lib", music: "lib" }, suggestions = {}, briefs = {}, scriptName = "", busy = {}, cueShown = {};
const fmtLvl = (v) => (v == null ? "" : `${v > 0 ? "+" : ""}${(+v).toFixed(0)} dB`);
const tcOf = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return `${h ? h + ":" + String(m).padStart(2, "0") : m}:${String(s % 60).padStart(2, "0")}`; };
const waves = {}, asked = new Set();

async function get(url) { return (await fetch(url)).json(); }
async function post(url, body) {
  return (await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })).json();
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}
const fmt = (s) => { s = Math.round(s || 0); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${(+s).toFixed(0)} s`; };
const fmtShort = (s) => (s < 10 ? `${(+s).toFixed(1)} s` : fmt(s));
const starred = (id) => settings.stars.includes(id);
// ★ in the sound effects: the take is in the selected tile's playlist; elsewhere: a favourite
const picked = (id) => (settings.tab === "sfx" ? ((tileOf(family) || {}).picks || []).includes(id) : starred(id));
const color = (it) => `var(--k-${it.layer === "sfx" ? it.family || "other" : it.layer})`;

// --- loading --------------------------------------------------------------------------------------
async function load(keepScroll) {
  const r = await get("/api/catalog");
  if (!r.ok) return toast(t("Erreur : {error}", { error: r.error }));
  const s = r.items.map((i) => i.id).join("|");
  settings = r.settings; next = r.next; members = r.members || {}; epidemicOn = r.epidemic; scriptName = r.script || "";
  for (const x of tiles()) for (const it of x.epi || []) byId[it.id] = it;
  if (!tileOf(family) && tiles().length) family = tiles()[0].id;
  if (!Object.values(busy).some(Boolean)) suggestions = r.suggestions || {};
  for (const b of Object.values(suggestions)) for (const c of b.cues || []) for (const it of c.results || []) byId[it.id] = it;
  $("#epi").hidden = !epidemicOn;
  $("#rnd").checked = settings.random !== false;
  if (s === sig && keepScroll) return renderTiles();
  sig = s; items = r.items; byId = { ...byId, ...Object.fromEntries(items.map((i) => [i.id, i])) };
  for (const l of ["sfx", "amb", "music"]) $(`[data-n="${l}"]`).textContent = items.filter((i) => i.layer === l).length || "";
  render();
}
async function reload() { sig = ""; await load(); }
window.addEventListener("focus", () => { if (!document.activeElement || !document.activeElement.closest(".ask, .cue")) load(true); });

function setTab(tab) {
  settings.tab = tab; shown = PAGE;
  post("/api/settings", { tab });
  render();
}
$$("#tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#rnd").addEventListener("change", async (e) => { settings = (await post("/api/settings", { random: e.target.checked })).settings; renderTiles(); });
$("#stars-only").addEventListener("click", () => { starsOnly = !starsOnly; $("#stars-only").classList.toggle("on", starsOnly); shown = PAGE; renderList(); });
let qTimer;
$("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { shown = PAGE; renderList(); }, 120); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter" && epidemicOn) searchEpidemic(); });
$("#epi").addEventListener("click", searchEpidemic);

async function suggest(tab) {
  busy[tab] = true; renderScript(tab);
  try {
    const r = await post("/api/suggest", { layer: tab, brief: briefs[tab] ?? (suggestions[tab] || {}).brief ?? "" });
    if (!r.ok) throw new Error(r.error);
    suggestions[tab] = r.block; delete briefs[tab]; cueShown = {};
    for (const c of r.block.cues) for (const it of c.results) byId[it.id] = it;
    if (!r.block.cues.length) toast(t("L'IA n'a rien proposé : précisez les consignes."));
  } catch (e) { toast(t("Erreur : {error}", { error: e.message })); }
  busy[tab] = false;
  if (settings.tab === tab && view[tab] === "script") renderScript(tab);
}
async function cueAction(act, el) {
  const tab = settings.tab, id = el.dataset.cue;
  const body = act === "redo" ? { layer: tab, cue: id, instruction: $(".instr", el).value }
    : { layer: tab, cue: id, queries: $(".q", el).value.split(";").map((q) => q.trim()).filter(Boolean) };
  busy[id] = true; $$("button", el).forEach((b) => (b.disabled = true));
  const b = $(`[data-act="${act}"]`, el); b.textContent = act === "redo" ? t("L'IA réfléchit…") : t("Recherche…");
  try {
    const r = await post(act === "redo" ? "/api/redo" : "/api/research", body);
    if (!r.ok) throw new Error(r.error);
    const cues = suggestions[tab].cues, k = cues.findIndex((c) => c.id === id);
    cues[k] = r.cue; cueShown[id] = 6;
    for (const it of r.cue.results) byId[it.id] = it;
  } catch (e) { toast(t("Erreur : {error}", { error: e.message })); }
  busy[id] = false;
  if (settings.tab === tab && view[tab] === "script") renderScript(tab);
}
$("#main").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.closest(".cue")) return;
  if (e.target.classList.contains("q")) cueAction("research", e.target.closest(".cue"));
  if (e.target.classList.contains("instr")) cueAction("redo", e.target.closest(".cue"));
});

async function searchEpidemic() {
  const tab = settings.tab, q = $("#q").value.trim();
  if (tab === "sfx" && !q) { const b = $('[data-act="tile-search"]'); if (b) b.click(); return; }
  $("#epi").disabled = true; $("#epi").textContent = t("Recherche…");
  try {
    const r = await post("/api/search", { layer: tab, q, family: tab === "sfx" ? family : "" });
    if (!r.ok) throw new Error(r.error);
    for (const f of r.found) byId[f.id] = f;
    found[tab] = r.found; foundLabel[tab] = "";
    if (!r.found.length) toast(t("Rien trouvé sur Epidemic."));
  } catch (e) { toast(t("Epidemic : {error}", { error: e.message })); }
  $("#epi").disabled = false; $("#epi").textContent = "Epidemic";
  renderList();
}

// --- rendering ------------------------------------------------------------------------------------
function render() {
  const tab = settings.tab || "sfx";
  $$("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("#rnd-wrap").hidden = tab !== "sfx";
  const v = tab === "sfx" ? "lib" : view[tab];
  $("#main").innerHTML = (tab === "sfx" ? `<div class="tiles" id="tiles"></div>`
      : `<div class="views"><button data-act="view" data-arg="lib" class="${v === "lib" ? "on" : ""}">${esc(t("Bibliothèque"))}</button>
          <button data-act="view" data-arg="script" class="${v === "script" ? "on" : ""}">${esc(t("Pour le script"))}</button></div>`)
    + `<div id="listwrap"></div>`;
  $(".search").style.visibility = v === "script" ? "hidden" : "";
  if (tab === "sfx") renderTiles();
  if (v === "script") renderScript(tab); else renderList();
}

const BRIEF_HINT = {
  music: "Ex. : synthés analogiques et pulsations discrètes, façon thriller documentaire ; jamais d'orchestre épique ni de piano triste. Plus chaud et acoustique pour les passages intimes. Références : la BO de Mindhunter, Jon Hopkins.",
  amb: "Ex. : sons fidèles à l'époque (XVIIIe siècle : pas de circulation moderne) ; discret, une couche par lieu ; des foules en français.",
};
function renderScript(tab) {
  const block = suggestions[tab] || {}, cues = block.cues || [];
  const brief = briefs[tab] ?? block.brief ?? "";
  const why = !scriptName ? t("Ouvrez d'abord le projet et son script dans la fenêtre Autocut.")
    : !epidemicOn ? t("Les propositions cherchent sur Epidemic : enregistrez votre clé sur la page Sons.") : "";
  const info = block.created ? t("{n} parties, proposées le {date}", { n: cues.length, date: block.created })
    + (block.timed ? "" : " · " + t("durées estimées (pas de derush ni de montage)")) : "";
  $("#listwrap").innerHTML = `<div class="ask">
      <label>${esc(tab === "music" ? t("Consignes pour la musique") : t("Consignes pour les ambiances"))}
        <textarea id="brief" rows="3" data-noi18n placeholder="${esc(t(BRIEF_HINT[tab]))}">${esc(brief)}</textarea></label>
      <div class="line"><button class="btn primary" data-act="suggest" ${why || busy[tab] ? "disabled" : ""}>${esc(busy[tab]
        ? t("L'IA lit le script…") : cues.length ? t("Proposer à nouveau") : t("Proposer pour le script"))}</button>
        <small>${esc(why || (busy[tab] ? t("une à deux minutes : l'IA lit tout le script, puis chaque partie est cherchée sur Epidemic")
          : info || t("Rien n'est placé : vous écoutez et glissez ce qui vous plaît.")))}</small></div></div>`
    + cues.map((c) => cueHtml(c, tab)).join("");
  $("#listwrap").style.display = "flex"; $("#listwrap").style.flexDirection = "column"; $("#listwrap").style.gap = "14px";
  $("#brief").addEventListener("input", (e) => { briefs[tab] = e.target.value; });
  observe();
}
function cueHtml(c, tab) {
  const when = [t("phrases {a}–{b}", { a: c.first, b: c.last }),
    c.start != null ? `${tcOf(c.start)} → ${tcOf(c.end ?? c.start + c.duration)}` : "", (c.start != null ? "" : "≈ ") + fmt(c.duration)]
    .filter(Boolean).join(" · ");
  const bpm = c.bpm_min || c.bpm_max ? ` · ${c.bpm_min || "…"}–${c.bpm_max || "…"} BPM` : "";
  const n = cueShown[c.id] || 6, res = c.results || [];
  return `<section class="cue" data-cue="${esc(c.id)}">
    <div class="cue-top"><b data-noi18n>${esc(c.title)}</b><span class="tc">${esc(when + bpm)}</span></div>
    <p class="feel" data-noi18n>${esc(c.feel)}</p>
    <p class="text" data-noi18n title="${esc(c.text || "")}">${esc(c.text || "")}</p>
    <div class="tools">
      <input class="q" data-noi18n value="${esc((c.queries || []).join("; "))}" title="${esc(t("Les recherches sur Epidemic, séparées par ;"))}">
      <button class="btn" data-act="research">${esc(t("Chercher"))}</button>
      <input class="instr" data-noi18n placeholder="${esc(t(tab === "music" ? "Refaire avec une consigne : « plus sombre », « sans batterie »…" : "Refaire avec une consigne : « plus lointain », « en intérieur »…"))}" value="${esc(c.instruction || "")}">
      <button class="btn" data-act="redo">${esc(busy[c.id] ? t("…") : t("Refaire"))}</button>
    </div>
    <div class="list">${res.length ? res.slice(0, n).map(rowHtml).join("") : `<div class="empty-note">${esc(t("Rien trouvé : changez les recherches."))}</div>`}
      ${res.length > n ? `<div class="more"><button class="btn" data-act="cue-more">${esc(t("{n} de plus", { n: res.length - n }))}</button></div>` : ""}</div>
  </section>`;
}

function renderTiles() {
  const el = $("#tiles");
  if (!el) return;
  const rnd = settings.random !== false;
  el.innerHTML = tiles().map((x) => {
    const all = members[x.id] || [], st = (x.picks || []).filter((i) => byId[i]).length;
    const nx = byId[next[x.id]];
    const count = all.length ? (st ? t("{n} étoilées sur {m}", { n: st, m: all.length }) : t("{n} prises", { n: all.length })) : t("aucune : cliquez pour chercher");
    return `<div class="tile ${x.id === family ? "sel" : ""} ${all.length ? "" : "empty"}" style="--c:${tileColor(x)}" data-family="${esc(x.id)}" ${all.length ? `data-drag="family:${esc(x.id)}"` : ""}>
      <div class="top"><b data-noi18n>${esc(t(x.label))}</b>
        <button class="icon" data-act="play-next" title="${esc(t("Écouter la prochaine prise"))}" ${nx ? "" : "disabled"}>▶</button>
        ${rnd ? `<button class="icon" data-act="skip" title="${esc(t("Une autre prise"))}" ${all.length > 1 ? "" : "disabled"}>⟳</button>` : ""}</div>
      <span class="count">${esc(count)}</span>
      <span class="take" data-noi18n title="${esc(nx ? nx.title : "")}"><span>${nx ? (rnd ? "→ " : "📌 ") + esc(nx.title) : ""}</span>
        <span class="lvl" title="${esc(t("Niveau conseillé dans Premiere (gain du clip)"))}">${esc(fmtLvl(nx && waves[nx.id] && waves[nx.id].level))}</span></span>
      <canvas data-wave="${nx ? esc(nx.id) : ""}"></canvas>
      <span class="state"></span></div>`;
  }).join("") + `<div class="tile add" data-act="new-tile" title="${esc(t("Une tuile à vous : un nom, des mots de recherche, les sons que vous étoilez"))}"><b>+</b><span>${esc(t("Nouvelle tuile"))}</span></div>`;
  observe();
}

function tileEditor(x) {
  return `<div class="tile-edit" data-tile="${esc(x.id)}">
    <label>${esc(t("Nom de la tuile"))}<input class="name-in" data-field="label" data-noi18n value="${esc(t(x.label))}"></label>
    <label>${esc(t("Mots de recherche (en anglais : les sons d'Epidemic sont nommés en anglais)"))}
      <input data-field="query" data-noi18n value="${esc(x.query || "")}" placeholder="${esc(t("ex. : riser, glitch, paper slide, camera shutter"))}"></label>
    ${epidemicOn ? `<button class="btn" data-act="tile-search">${esc(t("Chercher sur Epidemic"))}</button>` : "<span></span>"}
    <button class="btn danger" data-act="tile-delete">${esc(t("Supprimer la tuile"))}</button>
  </div>`;
}

function matches(it, q) {
  if (!q) return true;
  const hay = `${it.title} ${it.name} ${it.artist || ""} ${(it.tags || []).join(" ")}`.toLowerCase();
  return q.split(/\s+/).every((w) => hay.includes(w));
}

function renderList() {
  const tab = settings.tab || "sfx", q = $("#q").value.trim().toLowerCase();
  const cur = tab === "sfx" ? tileOf(family) : null;
  let rows = tab === "sfx" && cur && !q ? (members[cur.id] || []).map((i) => byId[i]).filter(Boolean)
    : items.filter((i) => i.layer === tab && matches(i, q));
  rows = rows.filter((i) => !starsOnly || picked(i.id));
  if (!(tab === "sfx" && !q)) rows.sort((a, b) => (picked(b.id) - picked(a.id)) || 0);
  const epi = (q || tab !== "sfx" ? found[tab] || [] : []).filter((i) => !starsOnly || picked(i.id));
  const hint = settings.random !== false ? t("★ : les prises que la tuile « {name} » tire au hasard", { name: cur ? t(cur.label) : "" })
    : t("Cliquez une ligne : la tuile la donnera à chaque glisser");
  const head = tab === "sfx"
    ? (q ? `<div class="results-head"><h2>${esc(t("Résultats pour « {q} »", { q }))}</h2>
          <button class="btn" data-act="tile-from-search">${esc(t("+ Tuile « {q} »", { q }))}</button>
          <small class="muted">${esc(hint)}</small></div>`
        : (cur ? tileEditor(cur) : "") + `<h2>${esc(cur ? t(cur.label) : "")} <small>${esc(hint)}</small></h2>`)
    : `<h2>${esc(tab === "amb" ? t("Ambiances") : t("Musiques"))} <small>${esc(t("Cliquez la forme d'onde pour écouter depuis là"))}</small></h2>`;
  const empty = !rows.length && !epi.length
    ? `<div class="list"><div class="empty-note">${esc(tab === "sfx" && cur && !q && !starsOnly ? (epidemicOn
          ? t("Rien dans cette tuile : écrivez des mots de recherche en anglais, puis « Chercher sur Epidemic » ; ou filtrez vos sons en haut et étoilez-les.")
          : t("Rien dans cette tuile : filtrez vos sons en haut et étoilez-les."))
        : items.some((i) => i.layer === tab) || q || starsOnly ? t("Aucun son ne correspond.")
        : tab === "music" ? t("Aucune musique : ajoutez votre dossier de musiques sur la page Sons de la fenêtre Autocut, ou cherchez sur Epidemic.")
        : tab === "amb" ? t("Aucune ambiance : ajoutez un dossier sur la page Sons de la fenêtre Autocut, ou cherchez sur Epidemic.")
        : t("Aucun son : ajoutez vos dossiers sur la page Sons de la fenêtre Autocut."))}</div></div>` : "";
  const block = (list, title) => list.length ? `${title ? `<h2>${esc(title)}</h2>` : ""}<div class="list">${list.slice(0, shown).map(rowHtml).join("")}
      ${list.length > shown ? `<div class="more"><button class="btn" data-act="more">${esc(t("{n} de plus", { n: list.length - shown }))}</button></div>` : ""}</div>` : "";
  $("#listwrap").innerHTML = head + block(epi, epi.length ? (foundLabel[tab] || t("Sur Epidemic")) : "") + (epi.length && rows.length ? `<h2>${esc(t("Vos sons"))}</h2>` : "") + block(rows, "") + empty;
  $("#listwrap").style.display = "flex"; $("#listwrap").style.flexDirection = "column"; $("#listwrap").style.gap = "14px";
  observe();
}

function rowHtml(it) {
  const cur = settings.tab === "sfx" && next[family] === it.id;
  const sub = it.layer === "music"
    ? [it.artist, it.stem && t("stem {part}", { part: it.stem }), it.bpm >= 40 ? `${it.bpm} BPM` : "", ...(it.tags || [])].filter(Boolean).join(" · ")
    : [it.source === "earshot" ? t("banque intégrée, une prise neuve à chaque glisser") : "", it.where || ""].filter(Boolean).join(" · ");
  const badge = it.source === "epidemic" ? `<span class="badge ep">Epidemic</span><button class="icon sim" data-act="similar" title="${esc(t("Des sons qui ressemblent à celui-ci"))}">≈</button>`
    : it.source === "earshot" ? `<span class="badge">${esc(t("banque"))}</span>` : "";
  return `<div class="row ${cur ? "cur" : ""}" style="--c:${color(it)}" data-id="${esc(it.id)}" data-drag="${esc(it.id)}">
    <button class="icon star ${picked(it.id) ? "on" : ""}" data-act="star" title="${esc(settings.tab === "sfx" ? t("Dans la tuile sélectionnée") : t("Étoile"))}">${picked(it.id) ? "★" : "☆"}</button>
    <button class="icon" data-act="play" title="${esc(t("Écouter"))}">▶</button>
    <span class="name"><b title="${esc(it.name)}" data-noi18n>${esc(it.title)}${badge}</b><small data-noi18n title="${esc(sub)}">${esc(sub)}</small>
      <span class="state"></span></span>
    <canvas data-wave="${esc(it.id)}"></canvas>
    <span class="lvl" title="${esc(t("Niveau conseillé dans Premiere (gain du clip)"))}">${esc(fmtLvl(waves[it.id] && waves[it.id].level))}</span>
    <span class="dur">${esc(fmtShort(it.dur))}</span></div>`;
}

// --- waveforms ------------------------------------------------------------------------------------
let io = null, batch = new Set(), batchTimer = null;
function observe() {
  if (!io) io = new IntersectionObserver((ents) => {
    for (const e of ents) if (e.isIntersecting) want(e.target.dataset.wave);
  }, { root: $("#main"), rootMargin: "200px" });
  io.disconnect();
  $$("canvas[data-wave]").forEach((c) => { draw(c); if (c.dataset.wave) io.observe(c); });
}
function want(id) {
  const it = byId[id];
  if (!id || !it || waves[id] || asked.has(id) || it.source === "epidemic") return;
  asked.add(id); batch.add(id);
  clearTimeout(batchTimer);
  batchTimer = setTimeout(() => {
    const ids = [...batch]; batch.clear();
    // the built-in bank renders its takes: asked apart, so the user's own files never wait for it
    const bank = ids.filter((i) => byId[i] && byId[i].source === "earshot"), files = ids.filter((i) => !bank.includes(i));
    const step = files.some((i) => byId[i] && byId[i].layer !== "sfx") ? 4 : 30;
    for (let k = 0; k < files.length; k += step) fetchWaves(files.slice(k, k + step));
    if (bank.length) fetchWaves(bank);
  }, 60);
}
async function fetchWaves(ids) {
  try {
    const r = await post("/api/waves", { ids });
    Object.assign(waves, r.waves || {});
    for (const id of ids) $$(`canvas[data-wave="${CSS.escape(id)}"]`).forEach(draw);
  } catch (e) { ids.forEach((i) => asked.delete(i)); }
}
function draw(c) {
  const id = c.dataset.wave, w = waves[id], it = byId[id];
  const lv = c.closest(".row, .tile") && c.closest(".row, .tile").querySelector(".lvl");
  if (lv && w) lv.textContent = fmtLvl(w.level);
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (!W) return;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d");
  g.scale(dpr, dpr);
  const css = getComputedStyle(c);
  const col = css.getPropertyValue(`--k-${it ? (it.layer === "sfx" ? it.family || "other" : it.layer) : "other"}`).trim() || "#888";
  if (!w || !w.wave || !w.wave.length) {
    g.fillStyle = css.getPropertyValue("--wave"); g.fillRect(0, H / 2 - 0.5, W, 1);
  } else {
    const n = w.wave.length, bw = W / n;
    g.fillStyle = col;
    for (let i = 0; i < n; i++) { const h = Math.max(1, w.wave[i] * (H - 2)); g.fillRect(i * bw, (H - h) / 2, Math.max(1, bw - 0.4), h); }
    if (it && it.layer === "sfx" && it.dur && w.sync) {           // where it hits: drop the file that much earlier
      const x = (w.sync / it.dur) * W;
      g.fillStyle = css.getPropertyValue("--text"); g.fillRect(x, 0, 1.5, H);
    }
  }
  if (playing && playing.id === id && audio.duration) {
    g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, 0, (audio.currentTime / audio.duration) * W, H);
  }
}
window.addEventListener("resize", () => $$("canvas[data-wave]").forEach(draw));

// --- listening ------------------------------------------------------------------------------------
const audio = new Audio();
let playing = null, hovered = null;
async function src(it) {
  if (it.source === "epidemic") return it.preview;
  if (it.source === "earshot") {
    const r = await post("/api/local", { id: it.id });
    if (r.state !== "ready") throw new Error(r.error || "…");
    if (r.wave) { waves[it.id] = { wave: r.wave, sync: r.sync }; }
    return `/snd?path=${encodeURIComponent(r.path)}`;
  }
  return `/snd?path=${encodeURIComponent(it.path)}`;
}
async function play(id, frac = 0) {
  const it = byId[id];
  if (!it) return;
  if (playing && playing.id === id && !audio.paused && !frac) return stop();
  try {
    const url = await src(it);
    if (!audio.src.endsWith(url)) audio.src = url;
    playing = it;
    const go = () => { if (frac && audio.duration) audio.currentTime = frac * audio.duration; audio.play(); };
    if (audio.readyState >= 1) go(); else audio.addEventListener("loadedmetadata", go, { once: true });
    $("#now").textContent = `▶ ${it.title}${it.artist ? " — " + it.artist : ""}`;
    tick();
  } catch (e) { toast(t("Lecture impossible : {error}", { error: e.message })); }
}
function stop() {
  audio.pause(); const was = playing; playing = null; $("#now").textContent = "";
  if (was) $$(`canvas[data-wave="${CSS.escape(was.id)}"]`).forEach(draw);
}
function tick() {
  if (!playing) return;
  $$(`canvas[data-wave="${CSS.escape(playing.id)}"]`).forEach(draw);
  if (!audio.paused) requestAnimationFrame(tick);
}
audio.addEventListener("ended", stop);
$("#stop").addEventListener("click", stop);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") {
    e.preventDefault();
    if (playing && !audio.paused) return stop();
    const h = hovered && (hovered.dataset.id || next[hovered.dataset.family]);
    if (h) play(h);
  }
});
document.addEventListener("mouseover", (e) => { hovered = e.target.closest(".row, .tile"); });

// --- clicks ---------------------------------------------------------------------------------------
document.addEventListener("click", async (e) => {
  if (justDragged) { justDragged = false; return; }
  const btn = e.target.closest("[data-act]"), row = e.target.closest(".row"), tile = e.target.closest(".tile");
  const act = btn && btn.dataset.act;
  if (act === "more") { shown += PAGE; return renderList(); }
  if (act === "view") { view[settings.tab] = btn.dataset.arg; return render(); }
  if (act === "cue-more") { const id = btn.closest(".cue").dataset.cue; cueShown[id] = (cueShown[id] || 6) + 12; return renderScript(settings.tab); }
  if (act === "suggest") return suggest(settings.tab);
  if (act === "research" || act === "redo") return cueAction(act, btn.closest(".cue"));
  if (act === "similar" && row) {
    const it = byId[row.dataset.id];
    btn.textContent = "…";
    const r = await post("/api/similar", { id: it.id });
    if (!r.ok) { btn.textContent = "≈"; return toast(t("Epidemic : {error}", { error: r.error })); }
    for (const f of r.found) byId[f.id] = f;
    const tab = it.layer === "sfx" ? "sfx" : it.layer;
    found[tab] = r.found; foundLabel[tab] = t("Comme « {name} »", { name: it.title });
    if (tab !== "sfx") view[tab] = "lib";
    $("#q").value = ""; shown = PAGE;
    if (settings.tab !== tab) return setTab(tab);
    return render();
  }
  if (act === "star" && row) {
    const id = row.dataset.id, on = !picked(id);
    if (settings.tab === "sfx") {
      const r = await post("/api/tile", { action: "pick", id: family, item: id, on });
      if (!r.ok) return toast(t("Erreur : {error}", { error: r.error }));
      Object.assign(tileOf(family), r.tile);
    } else settings = (await post("/api/settings", { star: id, on })).settings;
    btn.classList.toggle("on", on); btn.textContent = on ? "★" : "☆";
    if (settings.tab === "sfx") await load(true);
    return;
  }
  if (act === "new-tile" || act === "tile-from-search") {
    const q = act === "tile-from-search" ? $("#q").value.trim() : "";
    const r = await post("/api/tile", { action: "create", label: q || t("Nouvelle tuile"), query: q, search: !!q && epidemicOn });
    if (!r.ok) return toast(t("Erreur : {error}", { error: r.error }));
    family = r.tile.id; $("#q").value = ""; shown = PAGE;
    await reload();
    if (!q) { const inp = $('.tile-edit [data-field="label"]'); if (inp) { inp.focus(); inp.select(); } }
    return;
  }
  if (act === "tile-search") {
    btn.disabled = true; btn.textContent = t("Recherche…");
    const r = await post("/api/tile", { action: "search", id: family });
    if (!r.ok) toast(t("Epidemic : {error}", { error: r.error }));
    else if (!(r.tile.epi || []).length) toast(t("Rien trouvé sur Epidemic."));
    return reload();
  }
  if (act === "tile-delete") {
    const x = tileOf(family);
    if (!x || !confirm(t("Supprimer la tuile « {name} » ? Les sons eux-mêmes ne sont pas touchés.", { name: t(x.label) }))) return;
    await post("/api/tile", { action: "delete", id: x.id });
    family = ""; return reload();
  }
  if (act === "play" && row) return play(row.dataset.id);
  if (act === "play-next" && tile) return play(next[tile.dataset.family]);
  if (act === "skip" && tile) {
    const r = await post("/api/skip", { family: tile.dataset.family });
    next[tile.dataset.family] = r.next; renderTiles(); markCurrent();
    if (playing) play(r.next);
    return;
  }
  if (e.target.tagName === "CANVAS" && row) {
    const r = e.target.getBoundingClientRect();
    return play(row.dataset.id, Math.max(0.001, (e.clientX - r.left) / r.width));
  }
  if (tile && !btn) {
    family = tile.dataset.family; $("#q").value = ""; shown = PAGE;
    renderTiles(); return renderList();
  }
  if (row && !btn && settings.tab === "sfx" && settings.random === false) {
    const it = byId[row.dataset.id];
    if (it.source === "epidemic") return;
    next[family] = (await post("/api/choose", { family, id: it.id })).next;
    renderTiles(); markCurrent();
  }
});
function markCurrent() { $$(".row").forEach((r) => r.classList.toggle("cur", settings.tab === "sfx" && next[family] === r.dataset.id)); }

// a tile's name and words: saved when the field is left (Enter too); new words search Epidemic again
document.addEventListener("change", async (e) => {
  const f = e.target.closest(".tile-edit [data-field]");
  if (!f) return;
  const id = f.closest(".tile-edit").dataset.tile, field = f.dataset.field, value = f.value.trim();
  const r = await post("/api/tile", { action: "update", id, [field]: value });
  if (!r.ok) return toast(t("Erreur : {error}", { error: r.error }));
  if (field === "query" && value && epidemicOn) await post("/api/tile", { action: "search", id });
  reload();
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest(".tile-edit [data-field]")) e.target.blur(); });

// --- drag into Premiere: only inside the Autocut window, which gives the page a native file drag ---
let down = null, justDragged = false;
function stateOf(el, txt, err) {
  const s = el.querySelector(".state");
  if (s) { s.textContent = txt || ""; s.classList.toggle("err", !!err); }
}
document.addEventListener("dragstart", (e) => e.preventDefault());
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => e.preventDefault());
document.addEventListener("mousedown", (e) => {
  justDragged = false;
  if (e.button !== 0 || e.target.closest("button, input, textarea")) return;
  const el = e.target.closest("[data-drag]");
  if (el) down = { x: e.clientX, y: e.clientY, el };
});
document.addEventListener("mouseup", () => { down = null; });
document.addEventListener("mousemove", (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) return;
  const el = down.el; down = null; justDragged = true;
  if (!API()) return toast(t("Ouvrez la planche sonore depuis la fenêtre Autocut pour glisser dans Premiere."));
  drag(el);
});
async function drag(el) {
  const target = el.dataset.drag, it = byId[target];
  el.classList.add("dragging");
  if (it && it.source === "epidemic") stateOf(el, t("téléchargement…"));
  let r;
  try { r = await API().drag(target); } catch (e) { r = { state: "error", error: String(e) }; }
  el.classList.remove("dragging");
  if (r.state === "working") { stateOf(el, t("téléchargement…")); return waitReady(el, r.id); }
  if (r.state === "error") return stateOf(el, t("échec : {error}", { error: r.error }), true);
  const got = byId[r.id];
  if (r.dropped) {
    const lvl = r.level != null ? " · " + t("gain {level}", { level: fmtLvl(r.level) }) : "";
    stateOf(el, (target.startsWith("family:") && got ? t("posé : {name}", { name: got.title }) : t("dans Premiere ✓")) + lvl);
    setTimeout(() => stateOf(el, ""), 4000);
  } else stateOf(el, t("prêt : glissez dans Premiere"));
  if (r.next) { next[target.slice(7)] = r.next; renderTiles(); markCurrent(); }
  if (r.rescan) load(true);
}
async function waitReady(el, id) {
  const r = await API().prepare(id);
  if (r.state === "working") return setTimeout(() => waitReady(el, id), 1500);
  stateOf(el, r.state === "error" ? t("échec : {error}", { error: r.error }) : t("prêt : glissez dans Premiere"), r.state === "error");
}
function dragReady() {
  if (!API()) $("#hint").textContent = t("Ouvrez la planche sonore depuis la fenêtre Autocut pour glisser dans Premiere.");
}
window.addEventListener("pywebviewready", dragReady);

load().then(() => setTimeout(dragReady, 600));
</script>
</body>
</html>
