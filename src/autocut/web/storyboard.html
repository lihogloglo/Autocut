<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #fff; --surface-2: #f2f4f7; --border: #e1e4ea; --text: #1b1d22; --muted: #6a7080;
  --accent: #4a6cf7; --ok: #1f9d63; --danger: #d6453d; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16171a; --surface: #212328; --surface-2: #272a30; --border: #2f323a; --text: #e7e8ec; --muted: #9399a6;
          --accent: #6d8bff; --ok: #3ccf8e; --danger: #ff6b63; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border);
             padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
header.top h1 { font-size: 18px; margin: 0; }
header.top .meta { color: var(--muted); font-size: 12.5px; }
header.top .sp { flex: 1; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 80px; }
button, select, input, textarea { font: inherit; color: var(--text); }
button.btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.btn:disabled { opacity: .5; cursor: default; }
select, input[type=text], textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; width: 100%; }
textarea { resize: vertical; line-height: 1.4; }
.bible { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 22px; }
.bible h2 { margin: 0 0 6px; font-size: 15px; }
.bible .brief { color: var(--muted); font-style: italic; margin: 0 0 10px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.sw i { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border); display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { border-radius: 999px; padding: 2px 10px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid transparent; }
.chip.off { opacity: .35; }
.bible details { margin-top: 8px; color: var(--muted); }
.bible details p { margin: 4px 0; }
h3.section { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 10px; }
.beat { display: grid; grid-template-columns: minmax(220px, 34%) 1fr; gap: 16px; background: var(--surface);
        border: 1px solid var(--border); border-left: 6px solid var(--tc, var(--border)); border-radius: var(--radius);
        padding: 14px; margin-bottom: 12px; }
.beat.locked { box-shadow: 0 0 0 2px var(--ok) inset; }
.beat .card img { width: 100%; border-radius: 6px; display: block; background: #16171a; aspect-ratio: 16/9; object-fit: cover; }
.beat .card .face { aspect-ratio: 16/9; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.beat .quote { color: var(--muted); font-style: italic; font-size: 13px; margin-top: 8px; }
.head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.head .id { font-weight: 700; }
.head .tc { color: var(--muted); font-size: 12.5px; }
.head select { width: auto; }
.head .sp { flex: 1; }
.f { margin: 6px 0; }
.f label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.f label button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
.title-in { font-weight: 650; font-size: 15px; }
details.f summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
details.f summary button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0 0 0 8px; }
pre.scene { background: var(--surface-2); border-radius: 7px; padding: 8px 10px; font-size: 12px; overflow-x: auto; margin: 0; white-space: pre-wrap; }
.redo { display: flex; gap: 8px; margin-top: 10px; }
.redo input { flex: 1; }
.busy { opacity: .55; pointer-events: none; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
         padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 10; }
@media (max-width: 760px) { .beat { grid-template-columns: 1fr; } main { padding: 12px 16px 60px; } }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Storyboard</h1>
  <span class="meta" id="meta"></span>
  <span class="sp"></span>
  <button class="btn" id="copy-md">Copier tout (Markdown)</button>
  <button class="btn primary" id="xml">Refaire le XML Premiere</button>
</header>
<main>
  <section class="bible" id="bible"></section>
  <div id="beats"></div>
</main>
<script src="/i18n.js"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (!window.t) window.t = (s, v) => (v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : s);   // page opened without the server
const FACE = "face caméra", ARCHIVE = "archive";
const C = window.I18N && I18N.lang !== "fr" ? ":" : " :";     // French puts a space before a colon
const techLabel = (n) => (n === FACE || n === ARCHIVE ? t(n) : n);    // the two built-in techniques are French data keys
const HUES = ["#4a6cf7", "#1f9d63", "#d6453d", "#9b59b6", "#0096aa", "#e67e22"];
let SB, hidden = new Set();

const tc = (s) => { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function color(name) {
  if (name === FACE) return "#6e7480";
  if (name === ARCHIVE) return "#c49646";
  const names = SB.style.bible.techniques.map((t) => t.name).filter((n) => n !== FACE && n !== ARCHIVE);
  const k = names.indexOf(name);
  return HUES[(k < 0 ? name.length : k) % HUES.length];
}
function toast(m) { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || t("erreur"));
  return d;
}
function copy(text) { navigator.clipboard.writeText(text || ""); toast(t("Copié")); }

function renderBible() {
  const b = SB.style.bible;
  $("#bible").innerHTML = `<h2>${t("Bible de style")}</h2>
    ${SB.style.brief ? `<p class="brief">« ${esc(SB.style.brief)} »</p>` : ""}
    <p>${esc(b.summary)}</p>
    <div class="swatches">${(b.palette || []).map((c) => `<span class="sw"><i style="background:${esc(c.hex)}"></i>${esc(c.name)} ${esc(c.hex)}</span>`).join("")}</div>
    <div class="chips">${(b.techniques || []).map((x) => `<span class="chip ${hidden.has(x.name) ? "off" : ""}" data-tech="${esc(x.name)}" title="${esc(x.look + " — " + x.use_for)}" style="background:${color(x.name)}">${esc(techLabel(x.name))} · ${SB.beats.filter((y) => y.technique === x.name).length}</span>`).join("")}</div>
    <details><summary>${t("Détails")}</summary>
      <p><b>${t("Lumière")}</b>${C} ${esc(b.lighting)}</p><p><b>${t("Matières")}</b>${C} ${esc(b.materials)}</p><p><b>${t("Caméra")}</b>${C} ${esc(b.camera)}</p>
      <p><b>${t("Typographie")}</b>${C} ${esc(b.typography)}</p><p><b>${t("Transitions")}</b>${C} ${esc(b.transitions)}</p>
      <p><b>${t("Motifs")}</b>${C} ${esc((b.motifs || []).join(" ; "))}</p><p><b>${t("À éviter")}</b>${C} ${esc((b.avoid || []).join(" ; "))}</p>
      <p><b>${t("Style des prompts")}</b>${C} ${esc(b.prompt_style)}</p>
      ${(b.techniques || []).map((x) => `<p><b>${esc(techLabel(x.name))}</b>${C} ${esc(x.look)} — ${t("pour")} ${esc(x.use_for)}</p>`).join("")}
    </details>`;
}

function field(b, key, label, rows, copyable) {
  return `<div class="f"><label><span>${t(label)}</span>${copyable ? `<button data-copy="${key}">${t("copier")}</button>` : ""}</label>
    <textarea rows="${rows}" data-k="${key}" data-noi18n>${esc(b[key])}</textarea></div>`;
}
function beatHtml(b) {
  const techs = SB.style.bible.techniques.map((t) => t.name);
  if (!techs.includes(b.technique)) techs.push(b.technique);
  const img = b.card ? `<img src="${esc(b.card)}?v=${b._v || 0}" alt="">` : `<div class="face">${t("Face caméra : pas d'illustration")}</div>`;
  const scene = b.scene && Object.keys(b.scene).length ? JSON.stringify(b.scene, null, 1) : "";
  return `<article class="beat ${b.locked ? "locked" : ""}" id="${b.id}" style="--tc:${color(b.technique)}" ${hidden.has(b.technique) ? "hidden" : ""}>
    <div class="card">${img}<div class="quote" data-noi18n>« ${esc(b.text)} »</div></div>
    <div>
      <div class="head"><span class="id">${b.id}</span><span class="tc">${tc(b.start)} · ${b.duration} s · ${t("phrases {a}–{b}", { a: b.first + 1, b: b.last + 1 })}</span>
        <select data-k="technique" data-noi18n>${techs.map((x) => `<option value="${esc(x)}" ${x === b.technique ? "selected" : ""}>${esc(techLabel(x))}</option>`).join("")}</select>
        <span class="sp"></span>
        <label><input type="checkbox" data-lock ${b.locked ? "checked" : ""}> ${t("verrouillé")}</label></div>
      <input type="text" class="title-in" data-k="title" value="${esc(b.title)}">
      ${field(b, "see", "On voit", 2)}
      ${field(b, "motion", "Mouvement", 1)}
      ${b.technique !== FACE ? field(b, "image_prompt", "Prompt image (anglais)", 3, true) : ""}
      ${b.video_prompt || b.technique !== FACE ? field(b, "video_prompt", "Prompt vidéo (anglais)", 2, true) : ""}
      ${scene ? `<details class="f"><summary><span>${t("Scène (Blender / MCP) — {n} objets", { n: (b.scene.objects || []).length })}</span> <button data-copy="scene">${t("copier")}</button></summary><pre class="scene" data-noi18n>${esc(scene)}</pre></details>` : ""}
      ${field(b, "notes", "Fabrication", 2)}
      ${b.reuse ? field(b, "reuse", "Rappel", 1) : ""}
      <div class="redo"><input type="text" placeholder="${esc(t("Refaire ce plan… (facultatif : « plutôt une carte », « plus sobre »)"))}" data-instr>
        <button class="btn" data-redo>${t("Refaire")}</button></div>
    </div></article>`;
}
function render() {
  let last = null, html = "";
  for (const b of SB.beats) {
    if (b.section !== last) { html += `<h3 class="section">${b.section ? esc(b.section) : t("Début")}</h3>`; last = b.section; }
    html += beatHtml(b);
  }
  $("#beats").innerHTML = html;
}

const timers = {};
function save(id, fields) {
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try {
      const d = await api("/api/update", { id, fields });
      const k = SB.beats.findIndex((x) => x.id === id);
      const v = (SB.beats[k]._v || 0) + 1;
      SB.beats[k] = { ...d.beat, _v: v };
      const img = $(`#${id} img`);
      if (img && !("locked" in fields && Object.keys(fields).length === 1)) img.src = `${d.beat.card}?v=${v}`;
    } catch (e) { toast(t("Non enregistré : {error}", { error: e.message })); }
  }, 500);
}

document.addEventListener("input", (e) => {
  const art = e.target.closest(".beat"), k = e.target.dataset.k;
  if (!art || !k || e.target.tagName === "SELECT") return;
  save(art.id, { [k]: e.target.value });
});
document.addEventListener("change", (e) => {
  const art = e.target.closest(".beat");
  if (!art) return;
  if (e.target.dataset.lock !== undefined) {
    art.classList.toggle("locked", e.target.checked);
    save(art.id, { locked: e.target.checked });
  } else if (e.target.dataset.k === "technique") {
    art.style.setProperty("--tc", color(e.target.value));
    save(art.id, { technique: e.target.value });
  }
});
document.addEventListener("click", async (e) => {
  const chip = e.target.closest("[data-tech]");
  if (chip) {
    const t = chip.dataset.tech;
    hidden.has(t) ? hidden.delete(t) : hidden.add(t);
    renderBible(); render();
    return;
  }
  const art = e.target.closest(".beat");
  if (!art) return;
  const b = SB.beats.find((x) => x.id === art.id);
  if (e.target.dataset.copy) {
    e.preventDefault();      // inside a <summary>: copy without folding
    copy(e.target.dataset.copy === "scene" ? JSON.stringify(b.scene, null, 1) : $(`[data-k=${e.target.dataset.copy}]`, art).value);
  } else if (e.target.dataset.redo !== undefined) {
    art.classList.add("busy");
    e.target.textContent = t("L'IA réfléchit…");
    try {
      const d = await api("/api/redo", { id: b.id, instruction: $("[data-instr]", art).value });
      const k = SB.beats.findIndex((x) => x.id === b.id);
      SB.beats[k] = { ...d.beat, _v: (b._v || 0) + 1 };
      art.outerHTML = beatHtml(SB.beats[k]);
      toast(t("{id} refait", { id: b.id }));
    } catch (err) {
      toast(t("Échec : {error}", { error: err.message }));
      art.classList.remove("busy");
      e.target.textContent = t("Refaire");
    }
  }
});
$("#xml").addEventListener("click", async () => {
  $("#xml").disabled = true;
  try { const d = await api("/api/xml"); toast(t("XML écrit : {file}", { file: d.path.split(/[\\/]/).pop() })); }
  catch (e) { toast(t("Échec : {error}", { error: e.message })); }
  $("#xml").disabled = false;
});
$("#copy-md").addEventListener("click", async () => copy(await (await fetch("storyboard.md", { cache: "no-store" })).text()));

(async () => {
  SB = await (await fetch("storyboard.json", { cache: "no-store" })).json();
  document.title = `Storyboard — ${SB.title}`;
  $("#title").textContent = SB.title;
  $("#meta").textContent = [t("{n} plans", { n: SB.beats.length }), t(SB.timing === "montage" ? "durées du montage" : "durées estimées"),
                             SB.engine, SB.created].join(" · ");
  renderBible();
  render();
})();
</script>
</body>
</html>
